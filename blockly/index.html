    /**
     * Switch the visible pane when a tab is clicked.
     * @param {string} clickedName Name of tab clicked.
     */
    function tabClick(clickedName) {
      if (document.getElementById('tab_xml').className == 'tabon') {
        var xmlTextarea = document.getElementById('content_xml');
        var xmlText = xmlTextarea.value;
        var xmlDom = null;
        try {
          xmlDom = Blockly.Xml.textToDom(xmlText);
        } catch (e) {
          var q = window.confirm('Error parsing XML:\n' + e + '\n\nAbandon changes?');
          if (!q) {
            return;
          }
        }
        if (xmlDom) {
          Blockly.mainWorkspace.clear();
          Blockly.Xml.domToWorkspace(Blockly.mainWorkspace, xmlDom);
        }
      }

      if (document.getElementById('tab_blocks').className == 'tabon') {
        Blockly.mainWorkspace.setVisible(false);
      }
      for (var i = 0; i < TABS_.length; i++) {
        var name = TABS_[i];
        document.getElementById('tab_' + name).className = 'taboff';
        document.getElementById('content_' + name).style.visibility = 'hidden';
      }

      selected = clickedName;
      document.getElementById('tab_' + clickedName).className = 'tabon';
      document.getElementById('content_' + clickedName).style.visibility = 'visible';
      renderContent();
      if (clickedName == 'blocks') {
        Blockly.mainWorkspace.setVisible(true);
      }
      Blockly.fireUiEvent(window, 'resize');
    }

    /**
     * Populate the currently selected pane with content generated from the blocks.
     */
    function renderContent() {
      var content = document.getElementById('content_' + selected);
      if (content.id == 'content_blocks') {
        Blockly.mainWorkspace.render();
      } else if (content.id == 'content_xml') {
        var xmlTextarea = document.getElementById('content_xml');
        var xmlDom = Blockly.Xml.workspaceToDom(Blockly.mainWorkspace);
        var xmlText = Blockly.Xml.domToPrettyText(xmlDom);
        xmlTextarea.value = xmlText;
        xmlTextarea.focus();
      } else if (content.id == 'content_arduino') {
        var arduinoTextarea = document.getElementById('content_arduino');
        arduinoTextarea.value = Blockly.Arduino.workspaceToCode();
        arduinoTextarea.focus();
      }
    }

    /**
     * Compute the absolute coordinates and dimensions of an HTML element.
     * @param {!Element} element Element to match.
     * @return {!Object} Contains height, width, x, and y properties.
     * @private
     */
    function getBBox_(element) {
      var height = element.offsetHeight;
      var width = element.offsetWidth;
      var x = 0;
      var y = 0;
      do {
        x += element.offsetLeft;
        y += element.offsetTop;
        element = element.offsetParent;
      } while (element);
      return {
        height: height,
        width: width,
        x: x,
        y: y
      };
    }

      const level = match ? match[1] : '1';
      const documentationData = levelDocumentation[level] || [];

      if (documentationData.length === 0) {
        docSection.innerHTML = '<p class="no-doc-message">No documentation available for this level.</p>';
        return;

      docSection.innerHTML += `<h2 class="documentation-title">Level ${level} Documentation </h2>`;

        const categoryDiv = document.createElement('div');
        categoryDiv.classList.add('accordion-category');

        const header = document.createElement('div');
        header.classList.add('accordion-header');
        header.innerHTML = `<span class="toggle-icon">+</span> ${categoryData.category}`;
        categoryDiv.appendChild(header);

        const contentDiv = document.createElement('div');
        contentDiv.classList.add('accordion-content');
        contentDiv.style.display = 'none'; // Initially hidden

        categoryData.items.forEach(item => {
          const itemDiv = document.createElement('div');
          itemDiv.classList.add('accordion-item');

          // Safely parse HTML content (block image/video)
          const mockBlockContainer = document.createElement('div');
          mockBlockContainer.classList.add('mock-block-container');
          mockBlockContainer.innerHTML = item.htmlBlockRepresentation || '';

          itemDiv.innerHTML = `
                        <h3>${item.title}</h3>
                        <p>${item.description}</p>
                        <div class="code-snippet">
                            <pre><code>${item.codeSnippet}</code></pre>
                        </div>

          contentDiv.appendChild(itemDiv);
        });

        categoryDiv.appendChild(contentDiv);
        docSection.appendChild(categoryDiv);

        header.addEventListener('click', () => {
          const isOpen = contentDiv.style.display === 'block';
          contentDiv.style.display = isOpen ? 'none' : 'block';
          header.querySelector('.toggle-icon').textContent = isOpen ? '+' : '–';
          header.classList.toggle('active', !isOpen); // Toggle active class for header
        });
      });

    /**
     * Initialize Blockly. Called on page load.
     */
    function init() {
      var container = document.getElementById('content_area');
      var onresize = function (e) {
        var bBox = getBBox_(container);
        for (var i = 0; i < TABS_.length; i++) {
          var el = document.getElementById('content_' + TABS_[i]);
          el.style.top = bBox.y + 'px';
          el.style.left = bBox.x + 'px';
          el.style.height = bBox.height + 'px';
          el.style.height = (2 * bBox.height - el.offsetHeight) + 'px';
          el.style.width = bBox.width + 'px';
          el.style.width = (2 * bBox.width - el.offsetWidth) + 'px';
        }
        if (Blockly.mainWorkspace.toolbox_.width) {
          document.getElementById('tab_blocks').style.minWidth =
            (Blockly.mainWorkspace.toolbox_.width - 38) + 'px';
        }
      };
      window.addEventListener('resize', onresize, false);

      // Extract level from URL
      const match = window.location.pathname.match(/\/level\/(\d+)/);
      const level = match ? match[1] : '1';

      // Render the documentation content
      renderDocumentationContent();


      // Select toolbox for the current level
      const toolboxText = toolboxXML[level] || toolboxXML['1'];
      const parser = new DOMParser();
      const toolboxDom = parser.parseFromString(toolboxText, 'text/xml');
      const toolboxElement = toolboxDom.getElementById('toolbox');

      // Inject Blockly with the level-specific toolbox
      Blockly.inject(document.getElementById('content_blocks'), {
        grid: {
          spacing: 25,
          length: 3,
          colour: '#e6f3ff',
          snap: true
        },
        media: '../../media/',
        toolbox: toolboxElement
      });

      auto_save_and_restore_blocks();

      // Load level-specific workspace
      const xmlText = levelXML[level];
      if (xmlText) {
        discard(); // Use the new discard function that clears and re-renders
        const xmlDom = Blockly.Xml.textToDom(xmlText);
        Blockly.Xml.domToWorkspace(Blockly.mainWorkspace, xmlDom);
      } else {
        console.error('Invalid level:', level);
      }

      // Automatically show help on page load
      renderHelpContent_Alternative();
    }

    /**
     * Send generated Arduino code to GDevelop.
     */
    function sendCodeToGDevelop() {
      if (typeof Blockly !== "undefined" && Blockly.mainWorkspace) {
        let generatedCode = Blockly.Arduino.workspaceToCode(Blockly.mainWorkspace);
        console.log("Generated Arduino Code:", generatedCode);
        window.parent.postMessage({
          type: "blocklyCode",
          code: generatedCode
        }, "*");
        
      } else {
        console.error("Blockly or workspace is not defined.");
       
      }
    }

    // Show notification function
    function showNotification(message, type) {
      const notification = document.createElement('div');
      notification.className = `notification ${type}`;
      notification.textContent = message;
      document.body.appendChild(notification);
      setTimeout(() => {
        notification.classList.add('show');
      }, 100);
      setTimeout(() => {
        notification.classList.remove('show');
        setTimeout(() => {
          document.body.removeChild(notification);
        }, 300);
      }, 3000);
    }

        }, "*");

      sendClicksToGDevelop();

    document.addEventListener("click", computeClickCount);
